name: Update Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Telemetry Refresh & Build Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/telemetry.py

      - name: Commit & Push Asset Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.json assets/
          git commit -m "chore(telemetry): auto-refresh telemetry and rebuild SVGs [skip ci]" || echo "No changes to commit"
          git push origin main
