name: Update Telemetry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Telemetry & Rebuild Panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/telemetry.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.json assets/*.svg assets/dark/*.svg
          git diff --cached --quiet || git commit -m "chore(telemetry): refresh live data and rebuild panels [skip ci]"
          git push
