      <text fill="#8C8C8C" class="mono" x="792" y="172" font-size="10" letter-spacing="2">PRODUCTION PLATFORMS SHIPPED</text>
    </g>
    <g class="rise d6">
      <text fill="#E6E6E6" class="mono" x="720" y="238" font-size="44" font-weight="700">18+</text>
      <text fill="#8C8C8C" class="mono" x="792" y="232" font-size="10" letter-spacing="2">ACADEMIC DEPARTMENTS ACTIVE</text>
    </g>
    <g class="rise d7">
      <text fill="#FFFFFF" class="mono" x="720" y="298" font-size="44" font-weight="700">∞</text>
      <text fill="#8C8C8C" class="mono" x="792" y="292" font-size="10" letter-spacing="2">TERMINAL SESSIONS CONCURRENT</text>
    </g>
