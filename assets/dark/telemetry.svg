  <text fill="#666666" class="mono" x="392" y="78" font-size="10" letter-spacing="2.5">SHIPPING VELOCITY · 2024 → 2026</text>
  <line x1="392" y1="252" x2="656" y2="252" stroke="#3A3A3A"/>
  <polyline class="spark" points="440,232 488,210 536,188 584,148 622,112 656,92" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
  <circle class="fade d6" cx="440" cy="232" r="2.8" fill="#E6E6E6"/>
  <text fill="#666666" class="mono" x="434" y="272" font-size="9.5" letter-spacing="1.5">&#x27;24</text>
  <circle class="fade d7" cx="488" cy="210" r="2.8" fill="#E6E6E6"/>
  <circle class="fade d8" cx="536" cy="188" r="2.8" fill="#E6E6E6"/>
  <text fill="#666666" class="mono" x="530" y="272" font-size="9.5" letter-spacing="1.5">&#x27;25</text>
  <circle class="fade d9" cx="584" cy="148" r="2.8" fill="#E6E6E6"/>
  <circle class="fade d10" cx="622" cy="112" r="2.8" fill="#FFFFFF"/>
  <text fill="#666666" class="mono" x="616" y="272" font-size="9.5" letter-spacing="1.5">&#x27;26</text>
  <circle class="fade d11" cx="656" cy="92" r="2.8" fill="#E6E6E6"/>
  <circle class="ring" style="transform-origin: 622px 112px;" cx="622" cy="112" r="4" stroke="#FFFFFF" fill="none"/>
  <text fill="#8C8C8C" class="mono fade d14" x="392" y="300" font-size="10" letter-spacing="1.5">trend — <tspan fill="#FFFFFF">accelerating</tspan></text>
  <g>
    <g class="rise d4">
      <text fill="#E6E6E6" class="mono" x="720" y="118" font-size="44" font-weight="700">500+</text>
      <text fill="#8C8C8C" class="mono" x="792" y="112" font-size="10" letter-spacing="2">CAMPUS USERS ENGAGED</text>
