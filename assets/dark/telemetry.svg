    <text fill="#8C8C8C" x="154" y="195" font-size="10">16%</text>
    <text fill="#E6E6E6" x="48" y="216">css</text>
    <rect class="bar d4" style="transform-origin: 48px 0;" x="48" y="224" width="30" height="6" fill="#E6E6E6"/>
    <text fill="#8C8C8C" x="88" y="231" font-size="10">5%</text>
    <text fill="#E6E6E6" x="48" y="252">python</text>
