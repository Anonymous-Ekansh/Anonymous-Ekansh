<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ekansh Jain — Full-stack engineer — products people actually need.">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards; }
    .tick { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.4s; }
    .d6 { animation-delay: 0.48s; }
    .d7 { animation-delay: 0.56s; }
    .d8 { animation-delay: 0.64s; }
    .d9 { animation-delay: 0.72s; }
    .d10 { animation-delay: 0.8s; }
    .d11 { animation-delay: 0.88s; }
    .d12 { animation-delay: 0.96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
    .d15 { animation-delay: 1.2s; }
    .d16 { animation-delay: 1.28s; }
    .d17 { animation-delay: 1.36s; }
    .d18 { animation-delay: 1.44s; }
    .d19 { animation-delay: 1.52s; }
    .d20 { animation-delay: 1.6s; }
    .d21 { animation-delay: 1.68s; }
    .d22 { animation-delay: 1.76s; }
    .d23 { animation-delay: 1.84s; }
    .d24 { animation-delay: 1.92s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .cursor, .dot, .ring, .bar, .spark, .tick {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .ring { opacity: 0 !important; }
    }
  </style>
  <!-- Top Header Rule -->
  <line class="draw d1" x1="48" y1="58" x2="952" y2="58" stroke="#3A3A3A" stroke-width="1"/>
  <g class="fade d1">
    <text class="mono" fill="#8C8C8C" x="48" y="44" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="#8C8C8C" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">INDIA</text>
  </g>

  <!-- Large Editorial Title with Rise Animation -->
  <g class="rise d2">
    <text fill="#E6E6E6" class="mono" x="46" y="174" font-size="84" font-weight="600" letter-spacing="-3">Ekansh Jain</text>
  </g>

  <!-- Subtitle -->
  <g class="fade d3">
    <text fill="#8C8C8C" class="mono" x="48" y="216" font-size="19" letter-spacing="0.2">Full-stack engineer — products people actually need.</text>
  </g>

  <!-- Status row and prompt with blinking block cursor -->
  <g class="fade d4">
    <text fill="#FFFFFF" class="mono" x="48" y="268" font-size="12.5" letter-spacing="0.5">status ▸ open to SWE internships · early-stage startup roles · product engineering · fintech</text>
  </g>
  <g class="fade d5">
    <text fill="#666666" class="mono" x="48" y="298" font-size="13">~/ekansh $</text>
    <rect class="cursor" x="146" y="284" width="9" height="17" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Divider Rule at y=342 & Pillars Row -->
  <line class="draw d6" x1="48" y1="342" x2="952" y2="342" stroke="#3A3A3A" stroke-width="1"/>
  <g class="fade d7">
    <text fill="#8C8C8C" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">FULL-STACK SYSTEMS  ·  APPLIED AI &amp; AGENTS  ·  FINTECH</text>
    <text fill="#8C8C8C" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">B.TECH CS</text>
  </g>
</svg>
