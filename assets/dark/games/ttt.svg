<svg viewBox="0 0 1000 290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interactive Tic-Tac-Toe Game">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .hover-cell:hover { fill-opacity: 0.8; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      .rise, .fade { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
  <line x1="48" y1="36" x2="952" y2="36" stroke="#3A3A3A" stroke-width="1"/>
  <text class="mono" x="48" y="24" font-size="11" letter-spacing="3" fill="#8C8C8C">INTERACTIVE SYSTEM · TIC-TAC-TOE</text>
  <text class="mono" x="952" y="24" font-size="11" letter-spacing="3" text-anchor="end" fill="#8C8C8C">CPU VS VISITOR</text>
  <g class="mono">
    <text x="48" y="74" font-size="16" font-weight="700" fill="#E6E6E6">YOUR TURN — PLAY X</text>
    <text x="48" y="104" font-size="12" fill="#8C8C8C">last: None</text>
    <text x="48" y="128" font-size="12" fill="#8C8C8C">moves played: 0</text>
    <text x="48" y="160" font-size="12" fill="#666666">Click any open number</text>
    <text x="48" y="180" font-size="12" fill="#666666">below to play a move</text>
    <text x="48" y="200" font-size="12" fill="#666666">via GitHub Issues.</text>
    <a href="https://github.com/Anonymous-Ekansh/Anonymous-Ekansh/issues/new?title=game%7Cttt%7Creset&body=Click%20%27Submit%20new%20issue%27%20to%20play%20move%20%60reset%60%20in%20%60ttt%60.%20You%20do%20not%20need%20to%20edit%20anything." target="_blank">
      <rect x="48" y="234" width="160" height="32" rx="0" fill="none" stroke="#3A3A3A" stroke-width="1" class="hover-cell"/>
      <text x="128" y="254" font-size="11.5" letter-spacing="2" text-anchor="middle" fill="#E6E6E6">[ RESET GAME ]</text>
    </a>
  </g>
