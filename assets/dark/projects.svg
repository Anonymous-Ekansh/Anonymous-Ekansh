<svg viewBox="0 0 1000 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projects by Ekansh Jain">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards; }
    .tick { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.4s; }
    .d6 { animation-delay: 0.48s; }
    .d7 { animation-delay: 0.56s; }
    .d8 { animation-delay: 0.64s; }
    .d9 { animation-delay: 0.72s; }
    .d10 { animation-delay: 0.8s; }
    .d11 { animation-delay: 0.88s; }
    .d12 { animation-delay: 0.96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
    .d15 { animation-delay: 1.2s; }
    .d16 { animation-delay: 1.28s; }
    .d17 { animation-delay: 1.36s; }
    .d18 { animation-delay: 1.44s; }
    .d19 { animation-delay: 1.52s; }
    .d20 { animation-delay: 1.6s; }
    .d21 { animation-delay: 1.68s; }
    .d22 { animation-delay: 1.76s; }
    .d23 { animation-delay: 1.84s; }
    .d24 { animation-delay: 1.92s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .cursor, .dot, .ring, .bar, .spark, .tick {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .ring { opacity: 0 !important; }
    }
  </style>
  <g class="mono">
    <g class="rise d1" transform="translate(0, 28)">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#E6E6E6" letter-spacing="0.8">01 / KINEXIS</text>
      <text x="952" y="24" font-size="12" fill="#666666" letter-spacing="1" text-anchor="end">github.com/Anonymous-Ekansh/Kinexis</text>
      <text x="48" y="48" font-size="13" fill="#8C8C8C">Campus networking platform architected to eliminate cross-department discovery silos across university ecosystems.</text>
      <text x="48" y="68" font-size="13" fill="#8C8C8C">Engineered with interest-tag filtering, live project discovery feeds, and real-time community engagement channels.</text>
      <text x="48" y="90" font-size="11" fill="#666666" letter-spacing="1">NEXT.JS · NODE.JS · TYPESCRIPT · SUPABASE · POSTGRESQL · 500+ USERS</text>
      <line x1="48" y1="106" x2="952" y2="106" stroke="#3A3A3A" stroke-width="1" opacity="0.6"/>
    </g>
    <g class="rise d2" transform="translate(0, 150)">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#E6E6E6" letter-spacing="0.8">02 / MEALMATE</text>
      <text x="952" y="24" font-size="12" fill="#666666" letter-spacing="1" text-anchor="end">github.com/Anonymous-Ekansh/MealMate</text>
      <text x="48" y="48" font-size="13" fill="#8C8C8C">Cross-platform meal planning application engineered with real-time distributed team state synchronization.</text>
      <text x="48" y="68" font-size="13" fill="#8C8C8C">Features shared collaborative food catalogs, group planning channels, and low-latency operational state updates.</text>
      <text x="48" y="90" font-size="11" fill="#666666" letter-spacing="1">REACT NATIVE · EXPO · TYPESCRIPT · SUPABASE REALTIME · ZUSTAND</text>
      <line x1="48" y1="106" x2="952" y2="106" stroke="#3A3A3A" stroke-width="1" opacity="0.6"/>
    </g>
    <g class="rise d3" transform="translate(0, 272)">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#E6E6E6" letter-spacing="0.8">03 / POLYINTEL</text>
      <text x="952" y="24" font-size="12" fill="#666666" letter-spacing="1" text-anchor="end">github.com/Anonymous-Ekansh/PolyIntel</text>
      <text x="48" y="48" font-size="13" fill="#8C8C8C">Market intelligence terminal for Polymarket contracts featuring real-time anomaly detection and volume analytics.</text>
      <text x="48" y="68" font-size="13" fill="#8C8C8C">Built with custom proxy caching infrastructure to bypass CORS and regional ISP API restrictions seamlessly.</text>
      <text x="48" y="90" font-size="11" fill="#666666" letter-spacing="1">NEXT.JS 14 · TYPESCRIPT · EXPRESS.JS · TANSTACK QUERY · TAILWINDCSS</text>
      <line x1="48" y1="106" x2="952" y2="106" stroke="#3A3A3A" stroke-width="1" opacity="0.6"/>
    </g>
  </g>
</svg>
