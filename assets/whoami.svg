<svg viewBox="0 0 1000 262" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — background, focus, status, communities">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards; }
    .tick { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.4s; }
    .d6 { animation-delay: 0.48s; }
    .d7 { animation-delay: 0.56s; }
    .d8 { animation-delay: 0.64s; }
    .d9 { animation-delay: 0.72s; }
    .d10 { animation-delay: 0.8s; }
    .d11 { animation-delay: 0.88s; }
    .d12 { animation-delay: 0.96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
    .d15 { animation-delay: 1.2s; }
    .d16 { animation-delay: 1.28s; }
    .d17 { animation-delay: 1.36s; }
    .d18 { animation-delay: 1.44s; }
    .d19 { animation-delay: 1.52s; }
    .d20 { animation-delay: 1.6s; }
    .d21 { animation-delay: 1.68s; }
    .d22 { animation-delay: 1.76s; }
    .d23 { animation-delay: 1.84s; }
    .d24 { animation-delay: 1.92s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .cursor, .dot, .ring, .bar, .spark, .tick {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .ring { opacity: 0 !important; }
    }
  </style>
  <text class="mono rise d1" x="48" y="34" font-size="15" fill="#333333">first-year CS student at Shiv Nadar University building scalable software and market systems.</text>
  <text class="mono rise d2" x="48" y="62" font-size="15" fill="#333333">crafting systems at the intersection of full-stack engineering, performance, and quantitative finance.</text>
  <text class="mono rise d3" x="48" y="90" font-size="15" fill="#333333">focused on computational correctness, clean interface design, and high-throughput architectures.</text>
  <line class="rise d4" x1="48" y1="124" x2="952" y2="124" stroke="#C4C4C4" stroke-width="1" opacity="0.6"/>
  <text class="mono rise d5" x="48" y="156" font-size="11" fill="#777777" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise d5" x="160" y="156" font-size="14.5" fill="#333333">Full-Stack Systems · Quant &amp; Market Systems · Distributed Infrastructure · Performance</text>
  <text class="mono rise d6" x="48" y="188" font-size="11" fill="#777777" letter-spacing="2.5">STATUS</text>
  <text class="mono rise d6" x="160" y="188" font-size="14.5" fill="#000000">open to SWE internships (2026/2027) · quant research roles · open-source collaboration</text>
  <text class="mono rise d7" x="48" y="220" font-size="11" fill="#777777" letter-spacing="2.5">COMMUNITIES</text>
  <text class="mono rise d7" x="160" y="220" font-size="14.5" fill="#333333">Technical Lead @ TEDx Shiv Nadar University · ACM Chapter · Finvest Club · E-Cell</text>
</svg>
