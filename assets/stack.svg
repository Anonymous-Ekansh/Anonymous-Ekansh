<svg viewBox="0 0 1000 228" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical Stack — Languages, Full Stack, Data, Systems, Tooling">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards; }
    .tick { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.4s; }
    .d6 { animation-delay: 0.48s; }
    .d7 { animation-delay: 0.56s; }
    .d8 { animation-delay: 0.64s; }
    .d9 { animation-delay: 0.72s; }
    .d10 { animation-delay: 0.8s; }
    .d11 { animation-delay: 0.88s; }
    .d12 { animation-delay: 0.96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
    .d15 { animation-delay: 1.2s; }
    .d16 { animation-delay: 1.28s; }
    .d17 { animation-delay: 1.36s; }
    .d18 { animation-delay: 1.44s; }
    .d19 { animation-delay: 1.52s; }
    .d20 { animation-delay: 1.6s; }
    .d21 { animation-delay: 1.68s; }
    .d22 { animation-delay: 1.76s; }
    .d23 { animation-delay: 1.84s; }
    .d24 { animation-delay: 1.92s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .cursor, .dot, .ring, .bar, .spark, .tick {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .ring { opacity: 0 !important; }
    }
  </style>
  <line x1="154" y1="10" x2="154" y2="200" stroke="#C4C4C4" stroke-width="1" opacity="0.4"/>
  <text class="mono rise d1" x="48" y="34" font-size="11.5" fill="#777777" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise d1" x="170" y="34" font-size="14.5" fill="#333333">C++ · TypeScript · JavaScript · Python · SQL · HTML/CSS</text>
  <text class="mono rise d2" x="48" y="70" font-size="11.5" fill="#777777" letter-spacing="2">FULL STACK</text>
  <text class="mono rise d2" x="170" y="70" font-size="14.5" fill="#333333">Next.js · React · Node.js · Express.js · React Native · Expo</text>
  <text class="mono rise d3" x="48" y="106" font-size="11.5" fill="#777777" letter-spacing="2">DATA / CLOUD</text>
  <text class="mono rise d3" x="170" y="106" font-size="14.5" fill="#333333">PostgreSQL · Supabase · Redis · REST APIs · TanStack Query</text>
  <text class="mono rise d4" x="48" y="142" font-size="11.5" fill="#777777" letter-spacing="2">SYSTEMS</text>
  <text class="mono rise d4" x="170" y="142" font-size="14.5" fill="#333333">Linux · Git &amp; GitHub · Docker · Shell / Zsh · Performance Profiling</text>
  <text class="mono rise d5" x="48" y="178" font-size="11.5" fill="#777777" letter-spacing="2">TOOLING</text>
  <text class="mono rise d5" x="170" y="178" font-size="14.5" fill="#333333">Neovim · Postman · Vercel · Netlify · TailwindCSS · Figma</text>
</svg>
