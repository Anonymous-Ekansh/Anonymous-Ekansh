<svg viewBox="0 0 1000 1130" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ten projects by Ekansh Jain">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade 0.6s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .ring { animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.4); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .4s forwards; }
    .tick { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: 0.08s; }
    .d2 { animation-delay: 0.16s; }
    .d3 { animation-delay: 0.24s; }
    .d4 { animation-delay: 0.32s; }
    .d5 { animation-delay: 0.4s; }
    .d6 { animation-delay: 0.48s; }
    .d7 { animation-delay: 0.56s; }
    .d8 { animation-delay: 0.64s; }
    .d9 { animation-delay: 0.72s; }
    .d10 { animation-delay: 0.8s; }
    .d11 { animation-delay: 0.88s; }
    .d12 { animation-delay: 0.96s; }
    .d13 { animation-delay: 1.04s; }
    .d14 { animation-delay: 1.12s; }
    .d15 { animation-delay: 1.2s; }
    .d16 { animation-delay: 1.28s; }
    .d17 { animation-delay: 1.36s; }
    .d18 { animation-delay: 1.44s; }
    .d19 { animation-delay: 1.52s; }
    .d20 { animation-delay: 1.6s; }
    .d21 { animation-delay: 1.68s; }
    .d22 { animation-delay: 1.76s; }
    .d23 { animation-delay: 1.84s; }
    .d24 { animation-delay: 1.92s; }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .cursor, .dot, .ring, .bar, .spark, .tick {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        transform: none !important;
        opacity: 1 !important;
      }
      .ring { opacity: 0 !important; }
    }
  </style>
  <g class="mono">
    <g transform="translate(0, 20)">
      <g class="rise d1">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">01 / KINEXIS</text>
      <text x="48" y="49" font-size="12" fill="#333333">Campus networking platform: discover students by stream, batch and interest, follow clubs, find collaborators.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Live at kinexis.in with 500+ active users; email-to-event ingestion pipeline and request-based encrypted DMs.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · TYPESCRIPT · SUPABASE · POSTGRES · RLS · REALTIME</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 130)">
      <g class="rise d2">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">02 / TRIALSAATHI</text>
      <text x="48" y="49" font-size="12" fill="#333333">Voice-first, audit-ready clinical trial management system for Ayurveda and Allopathy research (SIH26046).</text>
      <text x="48" y="68" font-size="12" fill="#333333">Bilingual eConsent and ePRO, role-based dashboards and a hash-chained cryptographic audit trail.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · FASTAPI · SUPABASE · PGTAP · PLAYWRIGHT · SARVAM AI</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 240)">
      <g class="rise d3">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">03 / MEDIKIOSK</text>
      <text x="48" y="49" font-size="12" fill="#333333">AI patient case-taking kiosk for Indian OPDs (SIH26047): voice or touch intake in Hindi and English.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Digitises old records with OCR, flags red-flag symptoms and hands the doctor a structured history.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · FASTAPI · SARVAM ASR/TTS/OCR · GROQ LLMS · AYUSH</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 350)">
      <g class="rise d4">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">04 / AGENTIC SUPPORT DESK</text>
      <text x="48" y="49" font-size="12" fill="#333333">Five-agent customer-support system returning traceable ANSWER / CLARIFY / ESCALATE decisions.</text>
      <text x="48" y="68" font-size="12" fill="#333333">99.54% intent accuracy, 0.0027 calibration error, sub-150ms on CPU with a live agent-trace dashboard.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">PYTHON · FASTAPI · ONNX · PGVECTOR · NEXT.JS · NLP</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 460)">
      <g class="rise d5">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">05 / ROOMY</text>
      <text x="48" y="49" font-size="12" fill="#333333">Roommate discovery platform for university students: lifestyle profiles, browsing and mutual interest.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Replaces random hostel allocation and WhatsApp forwards with compatibility-first matching.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · TYPESCRIPT · SUPABASE SSR · TAILWIND · VERCEL</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 570)">
      <g class="rise d6">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">06 / TEDXSNIOE 2026 WEBSITE</text>
      <text x="48" y="49" font-size="12" fill="#333333">Event website with flexible group registration, tiered pricing and email confirmations.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Payment desk with UPI QR, screenshot verification and an admin approve / decline workflow.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · SUPABASE · STORAGE · NODEMAILER · FRAMER MOTION</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 680)">
      <g class="rise d7">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">07 / B-CON WEBSITE</text>
      <text x="48" y="49" font-size="12" fill="#333333">Business Conclave site with speaker reveals, sponsor wall, FAQ, countdown and a 3D sponsor globe.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Built on the T3 stack with in-app payments, S3 presigned uploads and contact flows.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS · TRPC · CHAKRA UI · THREE.JS · AWS S3 · NODEMAILER</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 790)">
      <g class="rise d8">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">08 / PORTFOLIO</text>
      <text x="48" y="49" font-size="12" fill="#333333">Personal site: terminal-flavoured hero, skills, projects and contact in plain HTML, CSS and JavaScript.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Live on Netlify; zero framework, zero build step.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">HTML · CSS · JAVASCRIPT · NETLIFY</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 900)">
      <g class="rise d9">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">09 / POLYINTEL</text>
      <text x="48" y="49" font-size="12" fill="#333333">Intelligence terminal for live Polymarket contracts: multi-factor scoring, anomaly detection, cross-market correlation.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Server-side proxy and Node caching layer beat ISP/CORS limits; includes a risk-managed paper-trading portfolio.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">NEXT.JS 14 · TYPESCRIPT · EXPRESS · TAILWIND · TANSTACK QUERY · ZUSTAND</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
    <g transform="translate(0, 1010)">
      <g class="rise d10">
      <text x="48" y="24" font-size="17" font-weight="700" fill="#333333" letter-spacing="0.8">10 / MEALMATE</text>
      <text x="48" y="49" font-size="12" fill="#333333">Android meal-planning app with real-time group collaboration: shared food catalog and in-app group chat.</text>
      <text x="48" y="68" font-size="12" fill="#333333">Live activity notifications with sub-second state sync across clients via Supabase Realtime.</text>
      <text x="48" y="87" font-size="11" fill="#777777" letter-spacing="0.4">REACT NATIVE · EXPO · TYPESCRIPT · SUPABASE · ZUSTAND</text>
      <line x1="48" y1="104" x2="952" y2="104" stroke="#C4C4C4" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
